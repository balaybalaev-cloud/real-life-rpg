<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1421"><title>REAL LIFE RPG — Modern</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#090f19;color:#f1f5fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1d304a 0%,#0c1320 45%,#090f19 100%);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #5c8cff;outline-offset:2px}.app{max-width:530px;min-height:100vh;margin:auto;padding:19px 17px 106px;background:linear-gradient(155deg,#111b2b,#0a111c 62%);box-shadow:0 0 70px #0006}.top,.row,.spread{display:flex;align-items:center;gap:12px}.spread{justify-content:space-between}.top{justify-content:space-between;margin:2px 0 27px}.brand{font-size:14px;letter-spacing:.12em;font-weight:850}.iconbtn{background:#172235;border:1px solid #2b394d;color:#dce6f7;border-radius:13px;min-width:39px;height:39px;font-size:19px}.avatar{height:79px;width:79px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#253b64,#121c31);border:3px solid #3d6db9;font-size:40px;box-shadow:0 0 30px #3b76d124}.hero{display:flex;align-items:center;gap:16px;margin-bottom:19px}.hero h1{font-size:21px;margin:0 0 3px}.sub{color:#9eacc2;font-size:13px}.rank{margin-left:auto;background:#1b2a42;border:1px solid #38537a;border-radius:12px;padding:10px 13px;font-size:24px;font-weight:900;color:#a8c8ff}.progress{background:#27364c;border-radius:30px;height:8px;overflow:hidden;margin:11px 0 6px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#3779ec,#67d1f5);border-radius:30px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:19px}.stat{background:#182335;border:1px solid #1d2d43;border-radius:14px;padding:13px 8px;min-height:77px}.stat small{display:block;color:#a4b1c4;font-size:11px;margin:0 0 7px}.stat b{font-size:23px}.stat .sym{color:#90b6fb;margin-right:6px}.tabs{display:flex;gap:5px;overflow:auto;padding:4px;background:#121c2a;border:1px solid #223047;border-radius:13px;margin-bottom:18px}.tabs button{background:transparent;border:0;color:#9eacc0;border-radius:10px;padding:10px 12px;white-space:nowrap;flex:1;font-size:12px}.tabs button.active{background:#e9f0ff;color:#18263d;font-weight:800}.card{border:1px solid #25344a;background:#121c2b;border-radius:17px;padding:15px;margin-bottom:14px}.heading{font-size:16px;font-weight:800}.small{font-size:12px;color:#9dacbf}.primary{border:0;background:#3e77f2;color:white;border-radius:11px;padding:10px 14px;font-weight:750}.ghost{border:1px solid #354762;background:#1b2b41;color:#d7e4f7;border-radius:10px;padding:8px 11px}.datebar{margin:0 0 14px}.quest{display:flex;align-items:center;gap:11px;padding:11px 9px;background:#182436;border:1px solid #223148;border-radius:12px;margin:8px 0}.thumb{width:52px;height:52px;flex-shrink:0;border-radius:10px;background:linear-gradient(135deg,#24426a,#182436);display:grid;place-items:center;font-size:25px}.qbody{flex:1;min-width:0}.qtitle{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.xp{color:#75b1ff;font-size:12px;margin-top:5px}.circle{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:2px solid #70839e;background:transparent;color:white;font-size:17px}.circle.done{border-color:#33bb83;background:#27a973}.edit{background:transparent;color:#93a8c4;border:0;font-size:18px;padding:6px}.chart{display:flex;align-items:end;gap:10px;height:130px;padding:12px 2px 0;border-bottom:1px solid #2d3b50}.barcol{flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:5px;height:100%;font-size:10px;color:#9aaac0}.barcol i{display:block;width:68%;min-height:3px;background:linear-gradient(#54a4ff,#386bd8);border-radius:5px 5px 2px 2px}.ring{width:95px;height:95px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#34c78d var(--pct),#27364b 0);position:relative}.ring:after{content:'';position:absolute;inset:12px;background:#121c2b;border-radius:50%}.ring b{position:relative;z-index:1;font-size:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(530px,100%);display:flex;justify-content:space-around;background:#111b29f5;border-top:1px solid #2b3c52;padding:10px 5px max(11px,env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav button{border:0;background:transparent;color:#95a7c0;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:55px}.nav button span{font-size:22px}.nav button.sel{color:#6b9aff}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#03070bc9;display:grid;place-items:center;z-index:10;padding:18px}.sheet{width:min(470px,100%);max-height:90vh;overflow:auto;background:#172335;border:1px solid #3a4a63;border-radius:20px;padding:21px}.field{display:block;margin:14px 0;color:#c2d1e5;font-size:13px}.field input,.field select,.field textarea{width:100%;margin-top:7px;padding:12px;background:#0d1726;color:#fff;border:1px solid #3b4b64;border-radius:10px}.field input[type=checkbox]{width:auto}.sheet h2{margin:0 0 15px}.flex{display:flex;gap:9px;flex-wrap:wrap}.empty{padding:22px;text-align:center;color:#9aacc4}.metric{background:#182538;border-radius:12px;padding:15px;flex:1;min-width:120px}.metric b{display:block;font-size:24px;margin-top:6px}.notice{font-size:12px;color:#9db1ca;line-height:1.5}.category{margin:14px 0}.category .progress{margin-top:7px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#23466c;color:white;padding:10px 17px;border-radius:10px;z-index:20;max-width:90%;text-align:center}.week{display:flex;gap:12px;align-items:center}.week .chart{flex:1}.menu{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(min-width:700px){.app{margin:30px auto;min-height:calc(100vh - 60px);border:1px solid #2b3c52;border-radius:25px}.nav{border-radius:0 0 25px 25px}}

.subopen{border:1px solid #314665;background:#20334c;color:#bcd6ff;border-radius:9px;padding:7px 9px;font-size:12px;white-space:nowrap}.subpanel{margin:0 0 12px;padding:14px;background:#101a2a;border:1px solid #2a405d;border-radius:13px}.subline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #28374b}.subline input{width:19px;height:19px;accent-color:#36bd8c;flex-shrink:0}.subline .label{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}.subline.done .label{text-decoration:line-through;color:#8092aa}.subline button{background:transparent;border:0;color:#a5b5cc;padding:5px}.subadd{display:flex;gap:8px;margin-top:12px}.subadd input{min-width:0;flex:1;background:#18283d;border:1px solid #354963;border-radius:10px;padding:11px;color:white}.subadd button{background:#3e77f2;border:0;color:white;border-radius:10px;padding:0 13px}.notes{width:100%;min-height:90px;resize:vertical;background:#18283d;color:#fff;border:1px solid #354963;border-radius:10px;padding:12px;margin-top:8px}.subhint{font-size:11px;color:#90a4bf;margin:10px 0 0}.questgroup{margin:8px 0}.questgroup .quest{margin-bottom:0}.questgroup:has(.subpanel) .quest{border-radius:12px 12px 0 0}.questgroup .subpanel{border-radius:0 0 12px 12px;border-top:0}
.goalcard{border:1px solid #2a3b53;border-radius:14px;padding:14px;margin-top:12px;background:#192639}.goalcard strong{font-size:14px}.nav button{min-width:42px}.nav{gap:0}.tabs button{flex:0 0 auto}</style></head><body><div class="app"><header class="top"><button class="iconbtn" id="menuBtn" aria-label="Меню">☰</button><div class="brand">REAL LIFE RPG</div><div class="row"><button class="iconbtn" id="exportBtn" title="Резервная копия">⇩</button><button class="iconbtn" id="profileBtn" title="Профиль">◉</button></div></header><section class="hero"><div class="avatar">⚡</div><div style="flex:1"><h1 id="heroName">БОЕЦ</h1><div class="sub" id="levelLabel">Уровень 1</div><div class="progress"><i id="xpBar" style="width:0%"></i></div><div class="small" id="xpText">0 / 100 XP</div></div><div class="rank" id="rank">E</div></section><section class="stats" id="stats"></section><div class="tabs" id="tabs"><button data-tab="today" class="active">Сегодня</button><button data-tab="calendar">Календарь</button><button data-tab="analytics">Статистика</button><button data-tab="monthly">Цели месяца</button><button data-tab="achievements">Достижения</button></div><main id="view"></main></div><nav class="nav" id="nav"><button data-tab="today" class="sel"><span>⌂</span>Главная</button><button data-tab="quests"><span>☑</span>Квесты</button><button data-tab="monthly"><span>◎</span>Цели</button><button data-tab="analytics"><span>▥</span>Статистика</button><button data-tab="community"><span>♧</span>Сообщество</button><button data-tab="profile"><span>◉</span>Профиль</button></nav><div class="modal hidden" id="goalModal"><div class="sheet"><div class="spread"><h2 id="goalModalTitle">Новая цель месяца</h2><button class="ghost" type="button" id="closeGoal">✕</button></div><form id="goalForm"><label class="field">Название цели<input id="gName" maxlength="100" required placeholder="Например, выпустить 8 роликов"></label><label class="field">Месяц<input type="month" id="gMonth" required></label><label class="field">Целевое количество<input type="number" id="gTarget" min="1" max="100000" value="1" required></label><label class="field">Единица измерения<input id="gUnit" maxlength="30" placeholder="раз, часов, роликов"></label><label class="field">Описание / заметки<textarea id="gNotes" rows="3" placeholder="Шаги, планы и подробности"></textarea></label><div class="flex"><button class="primary" type="submit">Сохранить цель</button><button class="ghost hidden" id="deleteGoal" type="button">Удалить</button></div></form></div></div><div class="modal hidden" id="modal"><div class="sheet"><div class="spread"><h2 id="modalTitle">Новый квест</h2><button class="ghost" id="closeModal">✕</button></div><form id="questForm"><label class="field">Название<input id="qName" maxlength="80" required placeholder="Например, тренировка ММА"></label><label class="field">Категория<select id="qCat"><option>Тренировки</option><option>Работа</option><option>Контент</option><option>Обучение</option><option>Здоровье</option><option>Личное</option></select></label><label class="field">Повторение<select id="qRepeat"><option value="daily">Каждый день (привычка)</option><option value="weekly">Раз в неделю</option><option value="once">Разовая задача</option></select></label><label class="field">Награда XP<input id="qXP" type="number" min="1" max="100" value="25" required></label><label class="field"><input id="qActive" type="checkbox" checked> Активный квест</label><div class="flex"><button class="primary" type="submit">Сохранить квест</button><button class="ghost hidden" type="button" id="deleteBtn">Удалить</button></div></form></div></div><input type="file" id="importFile" accept="application/json" hidden><div class="toast hidden" id="toast"></div><script>
(()=>{'use strict';const KEY='real_life_rpg_reference_v1';const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const initial=[];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.quests)||!Array.isArray(data.history))data={name:'БОЕЦ',quests:[],history:[]};data.quests=data.quests.filter(q=>!/^starter[0-5]$/.test(q.id));data.monthly=Array.isArray(data.monthly)?data.monthly:[];let tab='today',selected=today(),editId=null,expanded=null,goalEditId=null,goalMonth=today().slice(0,7);const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));data.subtasks=data.subtasks&&typeof data.subtasks==='object'?data.subtasks:{};data.notes=data.notes&&typeof data.notes==='object'?data.notes:{};data.subdone=data.subdone&&typeof data.subdone==='object'?data.subdone:{};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{notify('Не удалось сохранить: проверь память браузера')}};const notify=s=>{const t=$('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)};save();const isoWeek=d=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+4-(x.getDay()||7));return x.getFullYear()+'-'+Math.ceil((((x-new Date(x.getFullYear(),0,1))/86400000)+1)/7)};const entries=(id)=>data.history.filter(h=>h.id===id);const completed=(q,date)=>entries(q.id).some(h=>q.repeat==='weekly'?isoWeek(h.date)===isoWeek(date):h.date===date);const visible=(q,date)=>q.active&&q.created<=date&&(q.repeat!=='once'||!data.history.some(h=>h.id===q.id));const forDay=date=>data.quests.filter(q=>q.active&&q.created<=date);const totalXP=()=>data.history.reduce((s,h)=>s+Number(h.xp||0),0);const level=()=>Math.floor(totalXP()/100)+1;const rank=()=>level()>=50?'S':level()>=35?'A':level()>=22?'B':level()>=12?'C':level()>=5?'D':'E';const emoji={'Тренировки':'🥊','Работа':'💼','Контент':'🎬','Обучение':'📚','Здоровье':'🥗','Личное':'✨'};const days=n=>Array.from({length:n},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(n-1-i));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')});function toggle(id,date){let q=data.quests.find(q=>q.id===id);if(!q)return;let existing=data.history.findIndex(h=>h.id===id&&(q.repeat==='weekly'?isoWeek(h.date)===isoWeek(date):h.date===date));if(existing>=0)data.history.splice(existing,1);else data.history.push({id,date,xp:q.xp,category:q.category,name:q.name});save();render()}function statHTML(){const cats=[['Сила','Тренировки','♜'],['Выносливость','Здоровье','♡'],['Интеллект','Обучение','♧'],['Дисциплина',null,'◎'],['Контент','Контент','▷'],['Финансы','Работа','▣']];$('stats').innerHTML=cats.map(([name,cat,icon])=>{let count=cat?data.history.filter(h=>h.category===cat).length:data.history.length;return `<div class="stat"><small><span class="sym">${icon}</span>${name}</small><b>${1+count}</b></div>`}).join('')}function head(){const xp=totalXP();$('heroName').textContent=data.name;$('levelLabel').textContent='Уровень '+level();$('xpBar').style.width=xp%100+'%';$('xpText').textContent=(xp%100)+' / 100 XP';$('rank').textContent=rank();statHTML();document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle(b.closest('#nav')?'sel':'active',b.dataset.tab===tab)})}function subpanel(q,date){let items=data.subtasks[q.id]||[];let done=data.subdone[date]||{};return `<div class="subpanel"><div class="spread"><strong style="font-size:13px">Подзадачи · ${items.filter(x=>done[x.id]).length}/${items.length}</strong><span class="small">${esc(date)}</span></div>${items.length?items.map(x=>`<div class="subline ${done[x.id]?'done':''}"><input type="checkbox" data-subcheck="${esc(x.id)}" data-parent="${esc(q.id)}" ${done[x.id]?'checked':''} aria-label="Выполнено"><span class="label">${esc(x.text)}</span><button data-subedit="${esc(x.id)}" data-parent="${esc(q.id)}" aria-label="Изменить">✎</button><button data-subdelete="${esc(x.id)}" data-parent="${esc(q.id)}" aria-label="Удалить">✕</button></div>`).join(''):'<p class="small">Пока пусто. Добавь клиента или задачу.</p>'}<form class="subadd" data-subform="${esc(q.id)}"><input name="subtext" maxlength="200" placeholder="Клиент, время, задача..." required aria-label="Новая подзадача"><button type="submit">＋</button></form><label class="field">Заметки<textarea class="notes" data-notes="${esc(q.id)}" placeholder="Любая информация по этому квесту...">${esc(data.notes[q.id]||'')}</textarea></label><p class="subhint">Подзадачи и заметки сохраняются автоматически. Галочки подзадач отдельные для каждой даты и не начисляют дополнительный XP.</p></div>`}function list(date,all=false){const arr=forDay(date).filter(q=>all||q.repeat!=='once'||!completed(q,date));return arr.length?arr.map(q=>`<div class="questgroup"><div class="quest"><div class="thumb">${emoji[q.category]||'✨'}</div><div class="qbody"><div class="qtitle">${esc(q.name)}</div><div class="xp">+${q.xp} XP · ${q.repeat==='daily'?'Ежедневно':q.repeat==='weekly'?'Еженедельно':'Один раз'}</div></div><button class="subopen" data-expand="${esc(q.id)}" aria-expanded="${expanded===q.id}">${expanded===q.id?'Свернуть':'Список ▾'}</button><button class="circle ${completed(q,date)?'done':''}" data-toggle="${esc(q.id)}" aria-label="Отметить выполнение">${completed(q,date)?'✓':''}</button><button class="edit" data-edit="${esc(q.id)}" aria-label="Редактировать">⋯</button></div>${expanded===q.id?subpanel(q,date):''}</div>`).join(''):'<div class="empty">Здесь пока нет заданий. Добавь свой первый квест.</div>'}function weekly(){let ds=days(7),counts=ds.map(d=>data.history.filter(h=>h.date===d).length),max=Math.max(1,...counts),count=counts.filter(x=>x>0).length,pct=Math.round(count/7*100);return `<section class="card"><div class="spread"><span class="heading">Прогресс недели</span><span class="small">${count}/7 активных дней</span></div><div class="week"><div class="chart">${ds.map((d,i)=>`<div class="barcol"><i style="height:${Math.max(3,counts[i]/max*94)}px"></i><span>${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d+'T12:00:00').getDay()]}</span></div>`).join('')}</div><div class="ring" style="--pct:${pct}%"><b>${pct}%</b></div></div></section>`}function todayView(){return `<div class="spread datebar"><button class="ghost" data-shift="-1">‹</button><strong>${new Date(selected+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}</strong><div class="row"><button class="ghost" data-reset-date>Сегодня</button><button class="primary" data-add>＋</button></div></div><section class="card"><div class="spread"><span class="heading">Ежедневные квесты</span><span class="small">${forDay(selected).filter(q=>completed(q,selected)).length}/${forDay(selected).length}</span></div>${list(selected)}</section>${weekly()}`}function analytics(){const ds=days(7),vals=ds.map(d=>data.history.filter(h=>h.date===d).reduce((s,h)=>s+h.xp,0)),max=Math.max(1,...vals);const cats=['Тренировки','Работа','Контент','Обучение','Здоровье','Личное'];const sum=totalXP();return `<section class="card"><h2 class="heading">Статистика</h2><div class="flex"><div class="metric"><span class="small">Всего XP</span><b>${sum}</b></div><div class="metric"><span class="small">Выполнено квестов</span><b>${data.history.length}</b></div><div class="metric"><span class="small">Активных дней</span><b>${new Set(data.history.map(h=>h.date)).size}</b></div></div></section><section class="card"><div class="heading">XP за 7 дней</div><div class="chart" style="height:190px">${ds.map((d,i)=>`<div class="barcol"><span>${vals[i]}</span><i style="height:${Math.max(3,vals[i]/max*130)}px"></i><span>${d.slice(8)}</span></div>`).join('')}</div></section><section class="card"><div class="heading">Прогресс по направлениям</div>${cats.map(c=>{let n=data.history.filter(h=>h.category===c).reduce((s,h)=>s+h.xp,0);return `<div class="category"><div class="spread"><span>${emoji[c]} ${c}</span><span class="small">${n} XP</span></div><div class="progress"><i style="width:${sum?100*n/sum:0}%"></i></div></div>`}).join('')}</section>`}function quests(){return `<section class="card"><div class="spread"><span class="heading">Мои квесты (${data.quests.length})</span><button class="primary" data-add>＋ Добавить</button></div>${data.quests.length?data.quests.map(q=>`<div class="quest"><div class="thumb">${emoji[q.category]||'✨'}</div><div class="qbody"><div class="qtitle">${esc(q.name)}</div><div class="xp">${q.xp} XP · ${q.active?'Активен':'На паузе'}</div></div><button class="ghost" data-edit="${esc(q.id)}">Изменить</button></div>`).join(''):'<div class="empty">Добавь свой первый квест</div>'}</section>`}function calendar(){return `<section class="card"><div class="heading">Календарь активности</div><p class="small">Выбери дату, чтобы увидеть выполненные задания</p><label class="field">Дата<input type="date" id="datePicker" value="${selected}"></label>${list(selected,true)}</section>${weekly()}`}function monthly(){const arr=data.monthly.filter(g=>g.month===goalMonth);const completedCount=arr.filter(g=>g.progress>=g.target).length;return `<section class="card"><div class="spread"><span class="heading">Ежемесячные цели</span><button class="primary" data-goal-add>＋ Добавить</button></div><label class="field">Выбери месяц<input type="month" id="goalMonthPicker" value="${goalMonth}"></label><p class="small">Выполнено ${completedCount} из ${arr.length} целей</p>${arr.length?arr.map(g=>{let pct=Math.min(100,Math.round(100*g.progress/g.target));return `<div class="goalcard"><div class="spread"><strong>${esc(g.name)}</strong><button class="edit" data-goal-edit="${esc(g.id)}" aria-label="Редактировать цель">⋯</button></div><p class="small">${g.progress} / ${g.target} ${esc(g.unit||'')} · ${pct}%</p><div class="progress"><i style="width:${pct}%"></i></div><div class="flex" style="align-items:center;margin-top:10px"><button class="ghost" data-goal-step="${esc(g.id)}" data-delta="-1" ${g.progress===0?'disabled':''}>−</button><button class="ghost" data-goal-step="${esc(g.id)}" data-delta="1" ${g.progress>=g.target?'disabled':''}>＋ Прогресс</button><button class="ghost" data-goal-set="${esc(g.id)}">Указать значение</button></div>${g.notes?`<p class="notice">${esc(g.notes)}</p>`:''}</div>`}).join(''):'<div class="empty">Пока нет целей на этот месяц. Создай первую цель.</div>'}</section>`}function openGoal(id){goalEditId=id||null;const g=data.monthly.find(x=>x.id===id);$('goalModalTitle').textContent=g?'Изменить цель':'Новая цель месяца';$('gName').value=g?.name||'';$('gMonth').value=g?.month||goalMonth;$('gTarget').value=g?.target||1;$('gUnit').value=g?.unit||'';$('gNotes').value=g?.notes||'';$('deleteGoal').classList.toggle('hidden',!g);$('goalModal').classList.remove('hidden')}function achievements(){let n=data.history.length;return `<section class="card"><div class="heading">Достижения</div>${[['Первый шаг',1],['Начало пути',10],['Постоянство',30],['Мастер квестов',100]].map(([s,t])=>`<div class="quest"><div class="thumb">${n>=t?'🏆':'🔒'}</div><div class="qbody"><div class="qtitle">${s}</div><div class="small">Выполнить ${t} квестов · ${Math.min(n,t)}/${t}</div></div></div>`).join('')}</section>`}function profile(){return `<section class="card"><div class="heading">Профиль</div><label class="field">Имя персонажа<input id="profileName" maxlength="24" value="${esc(data.name)}"></label><button class="primary" data-save-name>Сохранить имя</button><p class="notice">Прогресс хранится только в этом браузере. Для переноса на другое устройство создай резервную копию.</p><div class="menu"><button class="ghost" data-export>Экспорт сохранения</button><button class="ghost" data-import>Импорт сохранения</button></div></section>`}function render(){head();$('view').innerHTML=tab==='today'?todayView():tab==='analytics'?analytics():tab==='monthly'?monthly():tab==='quests'?quests():tab==='calendar'?calendar():tab==='achievements'?achievements():tab==='profile'?profile():`<section class="card"><div class="heading">Сообщество</div><p class="notice">Многопользовательские функции появятся после подключения безопасной авторизации и базы данных. Сейчас твои данные доступны только тебе на этом устройстве.</p></section>`}function openForm(id){editId=id||null;const q=data.quests.find(q=>q.id===id);$('modalTitle').textContent=q?'Редактировать квест':'Новый квест';$('qName').value=q?.name||'';$('qCat').value=q?.category||'Тренировки';$('qRepeat').value=q?.repeat||'daily';$('qXP').value=q?.xp||25;$('qActive').checked=q?.active??true;$('deleteBtn').classList.toggle('hidden',!q);$('modal').classList.remove('hidden')}function exportSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='real-life-rpg-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.hasAttribute('data-goal-add'))openGoal();else if(b.dataset.goalEdit)openGoal(b.dataset.goalEdit);else if(b.dataset.goalStep){const g=data.monthly.find(x=>x.id===b.dataset.goalStep);if(g){g.progress=Math.max(0,Math.min(g.target,g.progress+Number(b.dataset.delta)));save();render()}}else if(b.dataset.goalSet){const g=data.monthly.find(x=>x.id===b.dataset.goalSet);if(g){const n=prompt('Текущий прогресс',String(g.progress));if(n!==null&&Number.isFinite(Number(n))){g.progress=Math.max(0,Math.min(g.target,Math.floor(Number(n))));save();render()}}}else if(b.hasAttribute('data-add'))openForm();else if(b.dataset.edit)openForm(b.dataset.edit);else if(b.dataset.toggle)toggle(b.dataset.toggle,selected);else if(b.dataset.expand){expanded=expanded===b.dataset.expand?null:b.dataset.expand;render()}else if(b.dataset.subdelete){let a=data.subtasks[b.dataset.parent]||[];data.subtasks[b.dataset.parent]=a.filter(x=>x.id!==b.dataset.subdelete);save();render()}else if(b.dataset.subedit){let a=data.subtasks[b.dataset.parent]||[],x=a.find(x=>x.id===b.dataset.subedit);if(x){let v=prompt('Изменить подзадачу',x.text);if(v!==null&&v.trim()){x.text=v.trim().slice(0,200);save();render()}}}else if(b.dataset.shift){let d=new Date(selected+'T12:00:00');d.setDate(d.getDate()+Number(b.dataset.shift));selected=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');render()}else if(b.hasAttribute('data-reset-date')){selected=today();render()}else if(b.hasAttribute('data-save-name')){data.name=$('profileName').value.trim()||'БОЕЦ';save();render()}else if(b.hasAttribute('data-export'))exportSave();else if(b.hasAttribute('data-import'))$('importFile').click()});$('goalForm').addEventListener('submit',e=>{e.preventDefault();const name=$('gName').value.trim(),target=Math.max(1,Math.floor(Number($('gTarget').value)||1));if(!name)return;const values={name,month:$('gMonth').value,target,unit:$('gUnit').value.trim(),notes:$('gNotes').value.trim()};const g=data.monthly.find(x=>x.id===goalEditId);if(g){Object.assign(g,values);g.progress=Math.min(g.progress,target)}else data.monthly.push({...values,id:'g'+Date.now()+Math.random().toString(36).slice(2),progress:0});goalMonth=values.month;save();$('goalModal').classList.add('hidden');render();notify('Цель сохранена')});$('deleteGoal').onclick=()=>{if(!confirm('Удалить ежемесячную цель?'))return;data.monthly=data.monthly.filter(g=>g.id!==goalEditId);save();$('goalModal').classList.add('hidden');render()};$('closeGoal').onclick=()=>$('goalModal').classList.add('hidden');$('goalModal').addEventListener('click',e=>{if(e.target===$('goalModal'))$('goalModal').classList.add('hidden')});$('questForm').addEventListener('submit' ,e=>{e.preventDefault();let name=$('qName').value.trim();if(!name)return;let q=data.quests.find(q=>q.id===editId);let values={name,category:$('qCat').value,repeat:$('qRepeat').value,xp:Math.min(100,Math.max(1,Number($('qXP').value)||25)),active:$('qActive').checked};if(q)Object.assign(q,values);else data.quests.push({...values,id:'q'+Date.now()+Math.random().toString(36).slice(2),created:today()});save();$('modal').classList.add('hidden');render();notify('Квест сохранён')});$('deleteBtn').onclick=()=>{if(!confirm('Удалить квест? История полученного XP останется.'))return;data.quests=data.quests.filter(q=>q.id!==editId);save();$('modal').classList.add('hidden');render()};$('closeModal').onclick=()=>$('modal').classList.add('hidden');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')});$('view').addEventListener('change',e=>{if(e.target.id==='goalMonthPicker'){goalMonth=e.target.value;render()}else if(e.target.id==='datePicker'){selected=e.target.value;render()}else if(e.target.dataset.subcheck){data.subdone[selected]??={};data.subdone[selected][e.target.dataset.subcheck]=e.target.checked;save();render()}else if(e.target.dataset.notes){data.notes[e.target.dataset.notes]=e.target.value;save()}});$('view').addEventListener('input',e=>{if(e.target.dataset.notes){data.notes[e.target.dataset.notes]=e.target.value;save()}});$('view').addEventListener('submit',e=>{let form=e.target.closest('[data-subform]');if(!form)return;e.preventDefault();let id=form.dataset.subform,text=form.elements.subtext.value.trim();if(!text)return;data.subtasks[id]??=[];data.subtasks[id].push({id:'s'+Date.now()+Math.random().toString(36).slice(2),text:text.slice(0,200)});save();render()});$('exportBtn').onclick=exportSave;$('profileBtn').onclick=()=>{tab='profile';render()};$('menuBtn').onclick=()=>{tab='quests';render()};$('importFile').onchange=async e=>{try{const incoming=JSON.parse(await e.target.files[0].text());if(!Array.isArray(incoming.quests)||!Array.isArray(incoming.history))throw Error();if(!confirm('Заменить текущие данные импортированными?'))return;data=incoming;data.subtasks=data.subtasks||{};data.notes=data.notes||{};data.subdone=data.subdone||{};data.monthly=Array.isArray(data.monthly)?data.monthly:[];data.quests=data.quests.filter(q=>!/^starter[0-5]$/.test(q.id));save();render();notify('Данные импортированы')}catch{notify('Неверный файл сохранения')}e.target.value=''};render()})();
</script></body></html>
